name: CI Docker Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Copiar código do repositório
      uses: actions/checkout@v3

    - name: Testar Build da Imagem Docker
      uses: docker/build-push-action@v4
      with:
        context: .
        push: false
